<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Schedule Inquiry | نظام الاستعلام الشامل</title>
    <style>
        :root {
            --primary: #1a5f7a;
            --secondary: #3498db;
            --bg: #f8f9fa;
            --text: #2c3e50;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        h1 {
            color: var(--primary);
            margin: 0;
            font-size: 1.5rem;
        }

        /* Responsive Search Grid */
        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            background: #eef2f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--primary);
        }

        input,
        select {
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        .time-range {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%; /* Ensures it stays within the column */
        }

        .time-range input {
            flex: 1; /* Makes both time inputs share the space equally */
            width: auto; /* Overrides the global 100% width */
            min-width: 0; /* Prevents the inputs from overflowing their flex container */
            padding: 10px; /* Slightly tighter padding to fit the time format better */
        }

        .time-range span {
            font-weight: bold;
            color: #555;
            white-space: nowrap; /* Prevents the word "إلى" from wrapping to a new line */
        }

        /* Table Styling - Desktop Default */
        .table-container {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #eee;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: var(--primary);
            color: white;
        }

        th,
        td {
            padding: 14px 15px;
            text-align: right;
            border-bottom: 1px solid #eee;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #f1f4f6;
        }

        /* Badges */
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .badge-mw {
            background-color: #e1f5fe;
            color: #0288d1;
        }

        .badge-st {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .badge-thu {
            background-color: #fff3e0;
            color: #ef6c00;
        }

        .count-display {
            text-align: left;
            margin-top: 10px;
            color: #777;
            font-size: 0.9rem;
        }

        /* =========================================
           MOBILE RESPONSIVE STYLES (Max Width 768px)
           ========================================= */
        @media screen and (max-width: 768px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 10px;
            }

            .search-grid {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            table,
            thead,
            tbody,
            th,
            td,
            tr {
                display: block;
            }

            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr {
                border: 1px solid #ccc;
                margin-bottom: 15px;
                border-radius: 10px;
                background: white;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
                overflow: hidden;
            }

            td {
                border: none;
                border-bottom: 1px solid #eee;
                position: relative;
                padding-right: 40%;
                padding-left: 10px;
                text-align: left;
                display: flex;
                justify-content: space-between;
                align-items: center;
                min-height: 30px;
            }

            td::before {
                position: absolute;
                top: 50%;
                right: 15px;
                transform: translateY(-50%);
                width: 35%;
                white-space: nowrap;
                font-weight: bold;
                color: var(--primary);
                text-align: right;
            }

            td:nth-of-type(1)::before { content: "رقم المادة"; }
            td:nth-of-type(2)::before { content: "اسم المادة"; }
            td:nth-of-type(3)::before { content: "الشعبة"; }
            td:nth-of-type(4)::before { content: "الأيام"; }
            td:nth-of-type(5)::before { content: "الوقت"; }
            td:nth-of-type(6)::before { content: "المدرس"; }
            td:nth-of-type(7)::before { content: "القاعة"; }

            td[style*="direction:ltr"] {
                text-align: left !important;
                direction: ltr !important;
                justify-content: flex-end;
            }

            td:nth-of-type(2) {
                background-color: var(--primary);
                color: white;
                font-size: 1.1rem;
                font-weight: bold;
                padding: 15px;
                text-align: center;
                justify-content: center;
            }

            td:nth-of-type(2)::before {
                content: "";
            }
        }
    </style>
</head>

            ['500246000', 'مختبر التجارة الالكترونية والحكومة الالكترونية /0 ساعة', '10', 'WED', '8.30 AM - 10.00 AM', 'وجدان طلاق رداد السلمة', 'و تم'], 
            ['500246000', 'مختبر التجارة الالكترونية والحكومة الالكترونية 0 ساعة', '11', 'WED', '10.00 AM - 11.30 AM', 'منی انور مطلق عويس', 'و تم'], 
            ['500246000', 'مختبر التجارة الالكترونية والحكومة الالكترونية /0 ساعة', '12', 'WED', '1.00 PM - 2.30 PM', 'وجدان طلاق رداد السلمة', 'و تم'] 
        ];

        // Helper function to convert raw time string (e.g., "8.30 AM") to minutes since midnight for easy comparison
        function parseTimeString(timeStr) {
            if (!timeStr) return null;
            let t = timeStr.trim().toLowerCase();
            let match = t.match(/(\d{1,2})\.(\d{2})\s*(am|pm)/);
            if (!match) return null;
            
            let h = parseInt(match[1]);
            let m = parseInt(match[2]);
            let isPM = match[3] === 'pm';
            
            if (isPM && h !== 12) h += 12;
            if (!isPM && h === 12) h = 12; // Typo fix for university schedules (12.30 AM is almost always 12:30 PM afternoon)
            
            return h * 60 + m;
        }

        function getMinutesFromInput(inputVal) {
            if (!inputVal) return null;
            let parts = inputVal.split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        function renderTable() {
            const dayFilter = document.getElementById('dayFilter').value;
            const instructorSearch = document.getElementById('instructorSearch').value.toLowerCase().trim();
            const courseIdSearch = document.getElementById('courseIdSearch').value.toLowerCase().trim();
            
            const timeFromVal = document.getElementById('timeFrom').value;
            const timeToVal = document.getElementById('timeTo').value;
            const fromMins = getMinutesFromInput(timeFromVal);
            const toMins = getMinutesFromInput(timeToVal);

            // Split the search string into an array of words
            const instructorTerms = instructorSearch ? instructorSearch.split(/\s+/) : [];

            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            let count = 0;

            rawData.forEach(row => {
                const [id, name, sec, dayCode, time, instructor, hall] = row;

                // 1. Day Check
                const matchesDay = !dayFilter || dayCode === dayFilter || (dayFilter === 'TH' && (dayCode !== 'MW' && dayCode !== 'ST'));
                
                // 2. Instructor Check: MUST contain every typed word anywhere in the string
                const instructorLower = instructor.toLowerCase();
                const matchesInstructor = instructorTerms.every(term => instructorLower.includes(term));
                
                // 3. ID Check
                const matchesId = id.toLowerCase().includes(courseIdSearch);
                
                // 4. Time Range Check
                let matchesTime = true;
                if (fromMins !== null || toMins !== null) {
                    let parts = time.split('-');
                    if (parts.length === 2) {
                        let classStartMins = parseTimeString(parts[0]);
                        let classEndMins = parseTimeString(parts[1]);
                        
                        if (classStartMins !== null && classEndMins !== null) {
                            if (fromMins !== null && classStartMins < fromMins) matchesTime = false;
                            if (toMins !== null && classEndMins > toMins) matchesTime = false;
                        }
                    }
                }

                // If all checks pass, append the row
                if (matchesDay && matchesInstructor && matchesId && matchesTime) {
                    count++;
                    const tr = document.createElement('tr');

                    // Badge Logic
                    let badgeClass = 'badge-thu';
                    let dayText = dayCode;
                    if (dayCode === 'MW') {
                        badgeClass = 'badge-mw';
                        dayText = 'ن ر (Mon-Wed)';
                    } else if (dayCode === 'ST') {
                        badgeClass = 'badge-st';
                        dayText = 'ح ث (Sun-Tue)';
                    }

                    tr.innerHTML = `
                    <td><b>${id}</b></td>
                    <td>${name}</td>
                    <td>${sec}</td>
                    <td><span class="badge ${badgeClass}">${dayText}</span></td>
                    <td style="direction:ltr; text-align:right;">${time}</td>
                    <td>${instructor}</td>
                    <td>${hall}</td>
                `;
                    tableBody.appendChild(tr);
                }
            });

            document.getElementById('countDisplay').innerText = `تم العثور على ${count} نتيجة`;

            if (count === 0) {
                tableBody.innerHTML =
                    '<tr><td colspan="7" style="text-align:center; padding:20px;">لا توجد نتائج مطابقة</td></tr>';
            }
        }

        // Initial Load
        renderTable();
    </script>
